[project]
name = "vibeboard-ai-api"
version = "0.1.0"
description = "FastAPI backend for VibeBoard AI Agile"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.1,<2.0.0",
    "fastapi>=0.115.12,<1.0.0",
    "pydantic-settings>=2.9.1,<3.0.0",
    "sqlmodel>=0.0.24,<0.1.0",
    "uvicorn[standard]>=0.34.2,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.3.5,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
